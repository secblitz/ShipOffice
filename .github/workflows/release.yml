name: Release

# Push a tag like v0.1.0 to build the binaries and publish them on a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            binary: shipoffice
            asset: shipoffice-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-2022
            binary: shipoffice.exe
            asset: shipoffice-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/shipoffice
          cp target/release/shipoffice README.md LICENSE.md dist/shipoffice/
          tar -C dist -czf "${{ matrix.asset }}" shipoffice

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/shipoffice | Out-Null
          Copy-Item target/release/shipoffice.exe, README.md, LICENSE.md dist/shipoffice/
          Compress-Archive -Path dist/shipoffice -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --title "ShipOffice $TAG" --generate-notes
          fi
