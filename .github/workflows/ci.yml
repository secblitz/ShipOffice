name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # winit and wgpu load X11, Wayland and Vulkan at runtime; only the bundled SQLite needs
          # a C compiler, which the runner has
          - name: Linux
            os: ubuntu-24.04
            binary: shipoffice
            artifact: shipoffice-linux-x86_64
            rustflags: -D warnings
          # the release build is a windowed app with the icon and version info embedded
          - name: Windows
            os: windows-2022
            binary: shipoffice.exe
            artifact: shipoffice-windows-x86_64
            rustflags: ""
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
