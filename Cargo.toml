[package]
name = "shipoffice"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A living isometric office for your AI coding agents"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/secblitz/ShipOffice"
build = "build.rs"

[dependencies]
iced = { version = "0.14", features = ["canvas", "image", "tokio", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
tiny-skia = "0.11"
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
glob = "0.3"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "local-offset"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "ShipOffice"
identifier = "dev.shipoffice.ShipOffice"
icon = ["assets/brand/icon-32.png", "assets/brand/icon-128.png", "assets/brand/icon-256.png", "assets/brand/icon-512.png", "assets/brand/icon-1024.png"]
category = "public.app-category.developer-tools"
short_description = "A living office for your AI coding agents"
